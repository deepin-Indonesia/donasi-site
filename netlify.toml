# Netlify configuration — donasi.deepin.id
# Repository PUBLIC — email sudah disensor via script, aman dipublik
# Redirects & headers untuk memblokir akses CSV mentah

[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.3"

# === SECURITY: Blokir akses CSV / data mentah ===
# Semua file .csv dan path _data/ dikembalikan 404

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/_data/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.csv"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/donors*"
  to = "/404.html"
  status = 404

# === Security Headers ===
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer-when-downgrade"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
