# Netlify configuration — donasi.deepin.id
# Repository PRIVATE — dibuild via GitHub Actions, dideploy ke Netlify via CLI
# Build section diabaikan Netlify (build via GHA), redirects & headers tetap diproses

[build]
  command = "echo 'Build dilakukan via GitHub Actions (.github/workflows/deploy.yml)'"
  publish = "_site"

# === SECURITY: Blokir akses CSV / data mentah ===
# Semua file .csv dan path _data/ dikembalikan 404

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/_data/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.csv"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/donors*"
  to = "/404.html"
  status = 404

# === Security Headers ===
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
